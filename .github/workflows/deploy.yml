name: Build and Deploy to Ubuntu Server with Docker

on:
  push:
    branches:
      - develop
  workflow_dispatch: # 수동 실행 가능

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Node.js 환경 설정
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # 3. pnpm 설치
      - name: Install pnpm
        run: |
          npm install -g pnpm

      # 4. 프론트엔드 빌드
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          pnpm install
          pnpm build

      # 5. Java 환경 설정
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      # 6. 백엔드 빌드 (Gradle bootJar)
      - name: Build Backend with Gradle
        working-directory: ./backend
        run: |
          ./gradlew bootJar

      # 7. Docker 이미지 빌드
      - name: Build Docker Image
        working-directory: ./backend
        run: |
          docker build -t circling:latest .

      # 8. Docker 이미지를 tar 파일로 저장
      - name: Save Docker Image
        run: |
          docker save -o circling.tar circling:latest

      # 9. SSH 키 생성 및 설정
      - name: Create SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/private-key.pem
          chmod 600 ~/private-key.pem
          echo "SSH key created and permissions set"

      # 10. 서버를 known_hosts에 추가
      - name: Add Known Host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          echo "Added ${{ secrets.SERVER_HOST }} to known_hosts"

      # 11. SCP로 Docker 이미지 전송
      - name: Transfer Docker Image to Remote Server
        run: |
          scp -i ~/private-key.pem -P ${{ secrets.SERVER_PORT }} circling.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/circling.tar
          echo "Docker image transferred to remote server"

      # 12. SSH로 원격 서버 접속 후 Docker 실행
      - name: Deploy to Remote Server
        run: |
          ssh -i ~/private-key.pem -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            docker load -i ${{ secrets.DEPLOY_PATH }}/circling.tar
            docker stop circling || true
            docker rm circling || true
            docker run -d --name circling --network mariadb_net -p 1489:1489 circling:latest
            docker network connect redis_redis-net circling
            echo "Docker container deployed on remote server"
          EOF

      # 13. 정리
      - name: Cleanup
        run: |
          rm -f ~/private-key.pem
          echo "Cleaned up SSH key"
